apiVersion: apps/v1
kind: Deployment
metadata:
  name: abeeway-guide-docs
  namespace: docs
spec:
  replicas: 2
  selector:
    matchLabels: { app: abeeway-guide-docs }
  template:
    metadata:
      labels: { app: abeeway-guide-docs }
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: abeeway-guide-docs
          image: rg.fr-par.scw.cloud/namespace-abeeway/abeeway-guide-docs:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  namespace: docs
  name: abeeway-guide-docs-service
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: abeeway-guide-docs-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: docs
  name: abeeway-guide-docs-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: abeeway-guide-docs-cert
  rules:
  - host: docs.abeeway.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abeeway-guide-docs-service
            port:
              number: 80